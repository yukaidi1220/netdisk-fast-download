name: 编译项目

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'bin/**'
      - '.github/**'
      - '.mvn/**'
      - '.run/**'
      - '.vscode/**'
      - '*.txt'
      - '*.md'
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 缓存 Maven 依赖
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: 编译项目
      run: ./mvnw clean compile

    - name: 打包项目
      run: ./mvnw package -DskipTests

    # 根 pom 的 surefire 写死 skipTests=true，CI 从不执行用例；这里在 runner 上临时打开，
    # 并用 failure.ignore 只暴露结果不阻断构建（存量失败类见 out/review 的对照臂记录）。
    - name: 运行测试（报告用，不阻断）
      run: |
        sed -i 's|<skipTests>true</skipTests>|<skipTests>false</skipTests>|' pom.xml
        ./mvnw -B -Dmaven.test.failure.ignore=true test
